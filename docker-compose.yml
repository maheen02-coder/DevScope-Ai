services:
  devscope:
    build:
      context: .
    image: devscope-ai:local
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_PATH: /app/data/devscope.db
      # Local compose runs on plain HTTP; enable this only behind HTTPS.
      COOKIE_SECURE: 'false'
      TRUST_PROXY: 'false'
    ports:
      - '4000:4000'
    volumes:
      - devscope-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  devscope-data:
