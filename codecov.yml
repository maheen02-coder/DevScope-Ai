coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: auto
        threshold: 5%

comment:
  layout: 'reach, diff, flags, files'
  require_changes: true

ignore:
  - 'server/tests/**'
  - 'server/scripts/**'
  - 'src/test/**'
  - 'src/main.jsx'
  - '**/*.test.{js,jsx}'
