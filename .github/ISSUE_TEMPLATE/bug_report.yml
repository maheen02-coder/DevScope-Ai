name: Bug report
description: Something is broken or behaving unexpectedly.
title: '[bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include secrets, tokens, or private repository contents.
        For security vulnerabilities, follow SECURITY.md instead of opening an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit hash or release you are running.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication
        - GitHub integration
        - AI analysis
        - Chat
        - Reports and sharing
        - Dashboard and analytics
        - UI / frontend
        - Deployment / Docker
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste server or browser logs after removing credentials and personal data.
      render: shell
