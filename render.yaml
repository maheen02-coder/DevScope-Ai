services:
  - type: web
    name: devscope-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free instance type: no card required. The container filesystem is
    # ephemeral, so accounts, saved reports, and sessions reset whenever the
    # service sleeps (15 min idle) or redeploys. Add a disk on a paid plan to
    # keep data permanently.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /app/data/devscope.db
      - key: TRUST_PROXY
        value: true
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: FRONTEND_ORIGIN
        value: https://dev-scope-ai-me-98f9.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
