<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DevScope AI Docs</title>
    <meta name="description" content="Documentation for DevScope AI — AI repository intelligence." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css" />
    <style>
      :root {
        --theme-color: #6ee7b7;
      }
      body {
        background: #0b0f14;
      }
      .sidebar {
        border-right: 1px solid #1f2937;
      }
      .markdown-section code {
        background: #111827;
      }
    </style>
  </head>
  <body>
    <div id="app">Loading DevScope AI documentation…</div>
    <script>
      window.$docsify = {
        name: 'DevScope AI',
        repo: 'https://github.com/maheen02-coder/DevScope-Ai',
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        search: {
          placeholder: 'Search the docs…',
          noData: 'No results.',
        },
        copyCode: { buttonText: 'Copy' },
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  </body>
</html>
